# One arm, `from_clean`. A call writes the fixture's source for its point, brings `notko-hlist` up to date and
# cleans the fixture package alone, all untimed; builds the fixture in cargo's dev profile inside the harness's
# `timed!` run block; then, untimed, reads cargo's own messages for what it built. A bench of one arm gets no
# validation and no determinism check from the harness, so the hooks library reads the call record instead and
# refuses the cell if any call built other than the fixture alone, from clean, at that cell's point.
#
# A point is the registry's column count, and the fixture asks one system's sets of every eight columns.

title = "product-build: the product over a registry of columns, built in the dev profile"
workload = "default"
master_seed = 0x6e6f_746b_6f70_6201
arms = ["from_clean"]
baseline = "from_clean"
may_differ = false
required = true
points = [32, 64, 128, 256]
timing = { passes = 3, runs_per_pass = 1, batch_size = 1, cooldowns_ms = [0], validation_seeds = 1, determinism_check_seeds = 1 }
