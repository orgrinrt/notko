# notko, the mockspace config.
#
# At the repo root rather than inside `mock/`: a repo has exactly one of these, and the root is
# where it belongs. `mock_dir` maps it to the workspace it governs.

# The engine pin. `mockspace_version` is the released form, and mockspace has cut no release yet,
# so this tracks the working trunk instead. The launcher re-resolves the branch head hourly.
mockspace_branch = "dev"

project_name = "notko"
crate_prefix = "notko"

abi_version = 1
mock_dir = "mock"

# No `canon_paths`: notko declares no canon. Its designs under `docs/design/` stand in for one.

proc_macro_crates = ["notko-macros"]
module_crates = []

# Layer labels by depth index. Empty until a design round reads the crate taxonomy off the crates
# as they stand, since the layers are a reading of that taxonomy rather than an input to it.
layers = []

[domain_kinds]

[known_macros]

[crate_colors]

# `mock search`: the one search over this repository, answered from its own index and never building
# it. It comes in alone from the lint pack's repository, without the pack's lints.
[lint-crates]
mockspace-extra-search = { git = "ssh://git@github.com/orgrinrt/mockspace-extra-lints.git", branch = "dev" }

