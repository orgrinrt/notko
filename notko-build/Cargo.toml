[package]
name = "notko-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "The build-script half of `#[profile]`'s custom tiers. Gathers one directory for the proc-macro to read, from a crate and whichever of its direct dependencies opted in."
readme = "README.md"
categories = ["development-tools::build-utils"]
keywords = ["build-script", "proc-macro", "notko", "fallible"]

# Named rather than excluded, so a file added later has to be asked for
# rather than shipping by accident.
include = ["src/**/*.rs", "README.md", "LICENSE"]

[dependencies]

# Only the tests, which build a real provider tree on disk. The accumulation
# they check is filesystem work, so a fake would be checking the fake.
[dev-dependencies]
tempfile = "3"
