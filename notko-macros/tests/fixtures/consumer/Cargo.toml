# A stand-in for a crate that reaches for `#[profile]`, built by
# `consumer_cfg.rs` to check what the macro's output does on the far side of
# the crate boundary. Its own workspace, so the repo's does not adopt it.
[workspace]

[package]
name = "notko-profile-consumer-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
notko = { path = "../../../..", features = ["macros"] }

# The convention `#[profile]` expects of a consumer. Declaring it is what makes
# the emitted `cfg(feature = "internal")` a known value rather than an
# unexpected one.
[features]
internal = []
