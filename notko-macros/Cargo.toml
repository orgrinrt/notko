[package]
name = "notko-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "The #[profile] attribute, which rewrites an ordinary Result function into one of notko's Hot, Warm or Cold fallibility tiers, signature and body both."
readme = "README.md"
categories = ["development-tools::procedural-macro-helpers"]
keywords = ["proc-macro", "codegen", "hot-path", "fallible", "attribute"]

# Named rather than excluded, so a file added later has to be asked for
# rather than shipping by accident.
# No test ships, and both absences are for the same reason: a test here needs
# `notko` itself, and the only way to reach it from inside this crate is the
# path dev-dependency below, which cargo strips on publish. A test that ships
# without it does not compile, and the consumer meets that before anything
# else.
#
# `tests/smoke.rs` writes `use notko::Just`. In the tarball there is no
# `notko`, so it fails to resolve and the package's own test run goes red on a
# fresh machine.
#
# `tests/consumer_cfg.rs` builds a fixture crate that path-depends on this
# repository, so it only runs from a checkout at all. `cargo package` warns
# about the stripped dependency each time, which is the intended state rather
# than something to chase.
include = ["src/**/*.rs", "notko-optimisers/*.rs", "README.md", "LICENSE"]

[features]
default = []
# Read by `tests/smoke.rs`, not by `src/`. The `cfg(feature = "internal")` the
# macro emits is evaluated in the crate it expanded into, and for the smoke test
# that crate is this one, so the release arm is unreachable without a feature
# here to turn on. `DEFAULT_GATE_FEATURE` is where the name comes from, and a
# consumer that wants a different one passes it to `CustomTier`.
internal = []

[lib]
proc-macro = true

[dependencies]
notko-macros-core = { path = "../notko-macros-core", version = "0.0.1" }
proc-macro2 = "1"

[dev-dependencies]
notko = { path = "..", features = ["try_trait_v2"] }
